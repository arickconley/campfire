name: Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...

  image:
    needs: test
    name: linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o campfire ./cmd/campfire
      - uses: actions/upload-artifact@v7
        with:
          name: campfire-linux-${{ matrix.goarch }}
          path: campfire
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --platform "linux/${{ matrix.goarch }}" \
            --provenance=false \
            --sbom=false \
            --push \
            -t "$image:${{ github.ref_name }}-${{ matrix.goarch }}" \
            .

  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ github.ref_name }}"
          docker buildx imagetools create \
            -t "$image:$tag" \
            -t "$image:latest" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"
